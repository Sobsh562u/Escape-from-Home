<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>举报中心</title>
<style>
  :root{--bg:#f4efe6;--card:#fffdf8;--line:#ddd6c6;--text:#3a3428;--dim:#6b6455;--red:#9c3a2f;--green:#3f7d4a}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:14px/1.7 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  .wrap{max-width:1000px;margin:0 auto;padding:24px 16px 80px}
  h1{font-size:20px;margin:0 0 6px}
  .lead{color:var(--dim);font-size:13px;margin:0 0 18px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin:0 0 16px}
  input,select,textarea{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--text)}
  button{font:inherit;padding:8px 14px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--text);cursor:pointer}
  button.primary{background:#3f7d4a;color:#fff;border-color:#3f7d4a}
  button.danger{background:#9c3a2f;color:#fff;border-color:#9c3a2f}
  button:disabled{opacity:.45;cursor:not-allowed}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{border-bottom:1px solid var(--line);padding:10px 8px;text-align:left;vertical-align:top}
  th{color:var(--dim);font-weight:600}
  .row-ops{white-space:nowrap}
  .mask{position:fixed;inset:0;background:rgba(20,18,14,.5);display:none;align-items:center;justify-content:center;padding:16px;z-index:9}
  .mask.show{display:flex}
  .modal{background:var(--card);border-radius:14px;max-width:560px;width:100%;padding:18px;border:1px solid var(--line)}
  .modal h3{margin:0 0 12px;font-size:16px}
  .kv{font-size:13px;color:var(--dim);word-break:break-all}
  .msg{font-size:13px;margin:10px 0 0;color:var(--dim);min-height:20px}
  .pill{display:inline-block;padding:1px 8px;border-radius:999px;background:#efe9dc;font-size:12px;color:var(--dim)}
  .red{color:var(--red)}.green{color:var(--green)}
</style>
</head>
<body>
<div class="wrap">
  <h1>举报中心</h1>
  <p class="lead">这个页面不在导航里，搜索引擎也抓不到。进来先对口令，才能看举报、封人。</p>

  <div class="card" id="gate">
    <label>管理口令 <input id="pwd" type="password" style="width:220px" placeholder="口令"></label>
    <button class="primary" id="gateBtn">进入</button>
    <p class="msg" id="gateMsg"></p>
  </div>

  <div id="main" hidden>
    <div class="card">
      <b>举报列表</b> <span class="pill" id="count">0 条</span>
      <div style="margin:10px 0 0">
        <button id="reload">刷新</button>
        <button id="checkBan">查封禁状态</button>
        <span class="msg" id="msg"></span>
      </div>
      <table>
        <thead><tr><th>对象</th><th>理由</th><th>举报人</th><th>时间</th><th>操作</th></tr></thead>
        <tbody id="rows"><tr><td colspan="5" class="kv">还没加载</td></tr></tbody>
      </table>
    </div>

    <div class="card">
      <b>密码重置申请</b> <span class="pill" id="pwCount">0 条</span>
      <div style="margin:10px 0 0">
        <button id="pwReload">刷新</button>
        <span class="msg" id="pwMsg"></span>
      </div>
      <table>
        <thead><tr><th>名字</th><th>说明</th><th>申请时间</th><th>状态</th><th>操作</th></tr></thead>
        <tbody id="pwRows"><tr><td colspan="5" class="kv">还没加载</td></tr></tbody>
      </table>
      <p class="kv">点「同意重置」会立刻把对方密码换成本人申请时填的新密码，他直接用新密码登录；驳回则旧密码不动。</p>
    </div>

    <div class="card">
      <b>访问记录</b> <span class="pill" id="visCount">—</span>
      <div style="margin:10px 0 0">
        <button id="visReload">刷新</button>
        <span class="msg" id="visMsg"></span>
      </div>
      <p class="kv" style="margin:8px 0 4px">24 小时内访问 ≥3 次的 IP（n 是次数，机器人列有值说明 UA 像程序）</p>
      <table>
        <thead><tr><th>IP</th><th>次数</th><th>首次</th><th>最近</th><th>机器人</th></tr></thead>
        <tbody id="visHot"><tr><td colspan="5" class="kv">还没加载</td></tr></tbody>
      </table>
      <p class="kv" style="margin:14px 0 4px">最近访问</p>
      <table>
        <thead><tr><th>时间</th><th>IP</th><th>路径</th><th>UA</th><th>机器人</th></tr></thead>
        <tbody id="visRows"><tr><td colspan="5" class="kv">还没加载</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<!-- 封禁弹窗 -->
<div class="mask" id="banMask">
  <div class="modal">
    <h3>封禁 <span id="banWho" class="red"></span></h3>
    <p class="kv" id="banMeta"></p>
    <p><label>期限
      <select id="banDays">
        <option value="1">1 天</option>
        <option value="7">7 天</option>
        <option value="30" selected>30 天</option>
        <option value="365">1 年</option>
        <option value="0">永久</option>
        <option value="-1">解封（撤销封禁）</option>
      </select></label></p>
    <p><label>理由（写进记录）<br><textarea id="banReason" rows="3" style="width:100%" placeholder="例如：排行榜刷分、辱骂其他玩家"></textarea></label></p>
    <p class="kv">封禁后，对方在游戏里登录会被拦下，提示“账号已被封禁”，并显示到期时间。</p>
    <p>
      <button class="danger" id="doBan" disabled>确认封禁</button>
      <button id="banCancel">取消</button>
      <span class="msg" id="banMsg"></span>
    </p>
  </div>
</div>

<!-- 资料弹窗 -->
<div class="mask" id="infoMask">
  <div class="modal">
    <h3>举报记录详情</h3>
    <pre class="kv" id="infoBody" style="white-space:pre-wrap;margin:0"></pre>
    <p style="margin:14px 0 0"><button id="infoClose">关闭</button></p>
  </div>
</div>

<script>
const SB = "https://spvouajdnckiyihhccux.supabase.co/rest/v1/rpc/";
const KEY = "sb_publishable_gOcJXjEu8wVL7tDFNCL5yw_7Y7Zy7ET";
let PWD = "";
let cur = null;   // 当前要封的人

function rpc(name, body){
  return fetch(SB + name, {
    method: "POST",
    headers: {"apikey": KEY, "Authorization": "Bearer " + KEY, "Content-Type": "application/json"},
    body: JSON.stringify(body || {})
  }).then(r => r.json());
}
function el(id){ return document.getElementById(id); }
function setMsg(t, cls){ const m = el("msg"); m.className = "msg " + (cls||""); m.textContent = t; }

el("gateBtn").addEventListener("click", async () => {
  const p = el("pwd").value.trim();
  if(!p){ el("gateMsg").textContent = "先填口令"; return; }
  el("gateMsg").textContent = "校验中…";
  const ok = await rpc("ehq_admin_ok", {p_key: p}).catch(() => null);
  if(ok === true){
    PWD = p; el("gate").hidden = true; el("main").hidden = false; load(); loadPw(); loadVis();
  } else {
    el("gateMsg").textContent = "口令不对，或者数据库函数还没建（见 数据库/举报中心.sql）";
  }
});

async function load(){
  el("rows").innerHTML = '<tr><td colspan="5" class="kv">加载中…</td></tr>';
  const r = await rpc("ehq_admin_reports", {p_key: PWD, p_limit: 60}).catch(() => null);
  if(!r || !r.ok){
    el("rows").innerHTML = '<tr><td colspan="5" class="kv">' + ((r && r.msg) || "连不上数据库") + '</td></tr>';
    return;
  }
  const rows = r.rows || [];
  el("count").textContent = rows.length + " 条";
  if(!rows.length){ el("rows").innerHTML = '<tr><td colspan="5" class="kv">没有举报目标了，等待别人来举报吧</td></tr>'; return; }
  el("rows").innerHTML = "";
  rows.forEach(r0 => {
    const who = r0.name || r0.target_name || r0.p_target_name || "(无名)";
    const why = r0.content || r0.reason || r0.p_reason || "(没写理由)";
    const by  = r0.link || r0.reporter_name || r0.p_reporter_name || "游客";
    const t   = r0.created_at || r0.p_created_at || "";
    const tr = document.createElement("tr");
    tr.innerHTML = '<td><b>' + esc(who) + '</b></td><td>' + esc(why) + '</td><td>' + esc(by) +
      '</td><td class="kv">' + esc(String(t).replace("T"," ").slice(0,16)) + '</td>' +
      '<td class="row-ops"><button>资料</button> <button class="danger">封禁</button> <button class="danger">删除记录</button></td>';
    tr.children[4].children[0].addEventListener("click", () => showInfo(r0));
    tr.children[4].children[1].addEventListener("click", () => openBan(r0));
    tr.children[4].children[2].addEventListener("click", () => delRow(r0));
    el("rows").appendChild(tr);
  });
}
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

el("reload").addEventListener("click", load);

// ===== 密码重置申请 =====
el("pwReload").addEventListener("click", loadPw);
function pwMsg(t, cls){ const m = el("pwMsg"); m.className = "msg " + (cls||""); m.textContent = t; }

async function loadPw(){
  el("pwRows").innerHTML = "加载中…";
  const r = await rpc("ehq_admin_pw_list", {p_key: PWD}).catch(() => null);
  if(!r || !r.ok){ el("pwRows").innerHTML = (r && r.msg) || "连不上数据库"; return; }
  const rows = r.rows || [];
  const pending = rows.filter(x => x.status === "pending").length;
  el("pwCount").textContent = pending + " 条待处理";
  if(!rows.length){ el("pwRows").innerHTML = "暂时没人申请重置密码"; return; }
  el("pwRows").innerHTML = "";
  rows.forEach(p0 => {
    const st = p0.status === "pending" ? "待处理" : p0.status === "approved" ? "已重置" : "已驳回";
    const tr = document.createElement("tr");
    tr.innerHTML = '<td><b>' + esc(p0.name) + '</b></td><td>' + esc(p0.note || "（没写）") +
      '</td><td class="kv">' + esc(String(p0.created_at || "").replace("T"," ").slice(0,16)) +
      '</td><td class="' + (p0.status === "pending" ? "red" : "green") + '">' + st + '</td>' +
      '<td class="row-ops">' + (p0.status === "pending"
        ? '<button class="primary">同意重置</button> <button class="danger">驳回</button>'
        : "—") + '</td>';
    if(p0.status === "pending"){
      tr.children[4].children[0].addEventListener("click", () => pwApprove(p0));
      tr.children[4].children[1].addEventListener("click", () => pwReject(p0));
    }
    el("pwRows").appendChild(tr);
  });
}

// ===== 访问记录 =====
el("visReload").addEventListener("click", loadVis);
function visMsg(t, cls){ const m = el("visMsg"); m.className = "msg " + (cls||""); m.textContent = t; }
function shortUa(u){
  u = String(u || "");
  var m = u.match(/(Chrome|Firefox|Safari|Edg|Opera|MSIE|Trident)[\/ ]?[\w.]+/);
  var os = u.match(/Windows|Android|iPhone|iPad|Linux|Mac OS X/);
  return (os ? os[0] + " · " : "") + (m ? m[0] : (u ? u.slice(0, 24) : "—"));
}
function tfmt(t){ return esc(String(t||"").replace("T"," ").slice(0,16)); }

async function loadVis(){
  el("visRows").innerHTML = "加载中…";
  const r = await rpc("ehq_admin_visits", {p_key: PWD, p_limit: 50}).catch(() => null);
  if(!r || !r.ok){ el("visRows").innerHTML = (r && r.msg) || "连不上数据库"; return; }
  el("visCount").textContent = "24h 共 " + (r.total24 || 0) + " 次";
  const hot = r.hot || [];
  if(!hot.length){ el("visHot").innerHTML = '<tr><td colspan="5" class="kv">还没有反复访问的 IP</td></tr>'; }
  else {
    el("visHot").innerHTML = "";
    hot.forEach(h => {
      const tr = document.createElement("tr");
      tr.innerHTML = '<td><b>' + esc(h.ip) + '</b></td><td>' + h.n + '</td><td class="kv">' + tfmt(h.first_seen) +
        '</td><td class="kv">' + tfmt(h.last_seen) + '</td><td class="' + (h.has_bot ? "red" : "") + '">' +
        (h.has_bot ? "像机器人" : "—") + '</td>';
      el("visHot").appendChild(tr);
    });
  }
  const rows = r.rows || [];
  if(!rows.length){ el("visRows").innerHTML = '<tr><td colspan="5" class="kv">还没有记录</td></tr>'; return; }
  el("visRows").innerHTML = "";
  rows.forEach(v => {
    const tr = document.createElement("tr");
    tr.innerHTML = '<td class="kv">' + tfmt(v.created_at) + '</td><td>' + esc(v.ip || "（没记到）") +
      '</td><td class="kv">' + esc(v.path || "/") + '</td><td class="kv">' + esc(shortUa(v.ua)) +
      '</td><td class="' + (v.bot ? "red" : "") + '">' + (v.bot ? "是" : "—") + '</td>';
    el("visRows").appendChild(tr);
  });
}

async function pwApprove(p0){
  if(!confirm("确认把「" + p0.name + "」的密码改成他申请时填的新密码？改完他就用新密码登录。")) return;
  pwMsg("重置中…");
  const r = await rpc("ehq_admin_pw_approve", {p_key: PWD, p_id: p0.id}).catch(() => null);
  if(r && r.ok){ pwMsg("已重置 " + (r.name || p0.name) + " 的密码", "green"); loadPw(); }
  else { pwMsg((r && r.msg) || "重置失败", "red"); }
}

async function pwReject(p0){
  if(!confirm("驳回「" + p0.name + "」的重置申请？旧密码保持不变。")) return;
  const r = await rpc("ehq_admin_pw_reject", {p_key: PWD, p_id: p0.id}).catch(() => null);
  if(r && r.ok){ pwMsg("已驳回", "green"); loadPw(); }
  else { pwMsg((r && r.msg) || "驳回失败", "red"); }
}

el("checkBan").addEventListener("click", async () => {
  const n = prompt("输入要查的名字（显示名或玩家ID都可以填一个）：");
  if(!n) return;
  const r = await rpc("ehq_ban_check", {p_name: n}).catch(() => null);
  if(!r){ setMsg("查不了，接口没通", "red"); return; }
  if(!r.banned){ setMsg(n + " 没有被封", "green"); return; }
  setMsg(n + " 在封禁中，到期：" + (r.until ? String(r.until).slice(0,10) : "永久"), "red");
});

async function delRow(row){
  const id = row.id;
  if(id == null){ setMsg("这条没有 id，删不了", "red"); return; }
  if(!confirm("确定删掉这条举报记录？删了就找不回来了。")) return;
  setMsg("删除中…", "");
  const r = await rpc("ehq_admin_delete_report", {p_key: PWD, p_id: id}).catch(() => null);
  if(r && r.ok){
    setMsg("已删除 " + (r.deleted || 1) + " 条", "green");
    load();
  } else {
    setMsg((r && r.msg) || "删除失败，检查数据库函数", "red");
  }
}

function showInfo(row){
  el("infoBody").textContent = JSON.stringify(row, null, 2);
  el("infoMask").classList.add("show");
}
el("infoClose").addEventListener("click", () => el("infoMask").classList.remove("show"));

function openBan(row){
  cur = row;
  const who = row.name || row.target_name || row.p_target_name || "";
  el("banWho").textContent = who;
  el("banMeta").textContent = "举报理由：" + (row.content || row.reason || row.p_reason || "（没写）") +
    " · 举报人：" + (row.link || row.reporter_name || row.p_reporter_name || "游客");
  el("banReason").value = "";
  el("banMsg").textContent = "";
  const btn = el("doBan");
  btn.disabled = false; btn.dataset.armed = ""; btn.textContent = "确认封禁";
  el("banMask").classList.add("show");
}
el("banCancel").addEventListener("click", () => el("banMask").classList.remove("show"));

// 期限选「解封」时，按钮文案跟着变
el("banDays").addEventListener("change", () => {
  const btn = el("doBan");
  const unban = el("banDays").value === "-1";
  btn.dataset.armed = ""; btn.disabled = false;
  btn.textContent = unban ? "确认解封" : "确认封禁";
});

// 点“确认封禁”后先倒数 1 秒，才真的能按——防手滑
el("doBan").addEventListener("click", async () => {
  const btn = el("doBan");
  if(btn.dataset.armed !== "1"){
    btn.dataset.armed = "1";
    btn.textContent = el("banDays").value === "-1" ? "再点一次确认解封" : "再点一次确认封禁";
    return;
  }
  const who = cur ? (cur.name || cur.target_name || cur.p_target_name || "") : "";
  const pid = cur ? (cur.target_pid || cur.p_target_pid || "") : "";
  const days = parseInt(el("banDays").value, 10);
  btn.disabled = true; btn.textContent = days === -1 ? "解封中…" : "提交中…";
  if(days === -1){
    const r0 = await rpc("ehq_admin_unban", {p_key: PWD, p_name: who}).catch(() => null);
    if(r0 && r0.ok){
      el("banMsg").className = "msg green";
      el("banMsg").textContent = "已解封 " + who + "，他现在可以正常登录了";
      btn.dataset.armed = "";
      setTimeout(() => el("banMask").classList.remove("show"), 900);
    } else {
      el("banMsg").className = "msg red";
      el("banMsg").textContent = (r0 && r0.msg) || "解封失败";
      btn.disabled = false; btn.textContent = "确认解封";
    }
    return;
  }
  const r = await rpc("ehq_admin_ban", {
    p_key: PWD, p_name: who, p_pid: pid, p_days: days,
    p_reason: el("banReason").value.trim(), p_admin: "作者"
  }).catch(() => null);
  if(r && r.ok){
    el("banMsg").className = "msg green";
    el("banMsg").textContent = "已封禁 " + who + "，到期：" + (r.until || "永久");
    el("doBan").dataset.armed = "";
    setTimeout(() => el("banMask").classList.remove("show"), 900);
  } else {
    el("banMsg").className = "msg red";
    el("banMsg").textContent = (r && r.msg) || "封禁失败，检查数据库函数";
    btn.disabled = false; btn.textContent = "现在确认封禁";
  }
});
</script>
</body>
</html>
