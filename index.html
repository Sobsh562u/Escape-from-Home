<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>逃家游戏 · Escape from Home</title>
<meta name="description" content="逃家游戏网页版：撑过 5 天，到 18 岁生日，逃出这个家。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%232b2b2b'/%3E%3Cpath d='M8 20 L20 8 M14 8 h6 v6' stroke='%23ffd166' stroke-width='2.5' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  :root{
    --ink:#1b1b1b;
    --paper:#f7f4ee;
    --paper2:#efe9dd;
    --line:#d8cfbd;
    --accent:#b7472a;
    --accent2:#2f5d50;
    --hp:#3f7d4f;
    --hp-low:#b7472a;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    line-height:1.6;
    padding:16px 14px 40px;
    min-height:100vh;
    background-image:radial-gradient(circle at 20% 0%, rgba(183,71,42,.06), transparent 55%),
                      radial-gradient(circle at 100% 100%, rgba(47,93,80,.07), transparent 60%);
  }
  .wrap{max-width:640px;margin:0 auto;}

  header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:18px;}
  h1{font-size:22px;margin:0;letter-spacing:.5px;}
  .sub{font-size:13px;color:#6d6455;margin-top:2px;}
  .dl{
    flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;
    min-height:44px;padding:0 14px;border-radius:8px;
    background:var(--ink);color:#fff;text-decoration:none;
    font-size:14px;white-space:nowrap;
  }
  .dl:hover{background:#000;}
  .dl svg{width:16px;height:16px;}

  .tabs{display:flex;gap:8px;margin-bottom:14px;}
  .tab{
    flex:1;min-height:44px;border:1px solid var(--line);background:var(--paper2);
    color:#4a4235;border-radius:8px;font-size:14px;cursor:pointer;font-family:inherit;
  }
  .tab[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink);}

  .panel{
    background:#fff;border:1px solid var(--line);border-radius:12px;
    padding:16px;margin-bottom:14px;
  }
  .stats{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:12px;}
  .stat{font-size:13px;color:#6d6455;}
  .stat b{color:var(--ink);font-size:18px;font-weight:600;margin-left:4px;}
  .hpbar{height:10px;border-radius:6px;background:#e7e0d2;overflow:hidden;flex:1 1 140px;min-width:140px;}
  .hpfill{height:100%;width:100%;background:var(--hp);transition:width .25s ease,background .25s ease;}
  .hpfill.low{background:var(--hp-low);}

  #log{
    height:230px;overflow-y:auto;font-size:14px;
    border-top:1px dashed var(--line);border-bottom:1px dashed var(--line);
    padding:10px 0;margin:0 0 12px;
    scroll-behavior:smooth;
  }
  #log p{margin:0 0 8px;animation:fade .18s ease-out;}
  #log p.day{color:#8a7d64;font-size:13px;margin-top:14px;}
  #log p.good{color:var(--accent2);}
  #log p.bad{color:var(--accent);}
  #log p.end{font-weight:600;}
  @keyframes fade{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}

  .acts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
  .acts button{
    min-height:46px;border-radius:8px;border:1px solid var(--line);
    background:var(--paper2);color:var(--ink);font-size:15px;font-family:inherit;cursor:pointer;
  }
  .acts button:hover{border-color:#b9ab8e;}
  .acts button.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
  .acts button.primary:hover{background:#9d3b22;}
  .acts button:disabled{opacity:.45;cursor:not-allowed;}

  .jumpbox{display:none;gap:8px;margin-top:10px;}
  .jumpbox.show{display:flex;}
  .jumpbox input{
    flex:1;min-height:46px;border:1px solid var(--line);border-radius:8px;
    padding:0 12px;font-size:16px;font-family:inherit;background:#fff;color:var(--ink);
  }
  .jumpbox button{
    min-height:46px;padding:0 16px;border-radius:8px;border:1px solid var(--line);
    background:var(--ink);color:#fff;font-size:14px;font-family:inherit;cursor:pointer;
  }

  footer{font-size:12px;color:#8a7d64;text-align:center;margin-top:20px;line-height:1.9;}
  footer a{color:#8a7d64;}
  .note{font-size:12px;color:#8a7d64;margin-top:10px;}
  .footbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:6px;}
  .footbar button{
    min-height:44px;padding:0 14px;border-radius:8px;border:1px dashed var(--line);
    background:transparent;color:#6d6455;font-size:13px;font-family:inherit;cursor:pointer;
  }
  .footbar button:hover{border-color:#b9ab8e;color:var(--ink);}
  .saveHint{font-size:12px;color:#a19680;margin:8px 0 0;}
  @media (min-width:768px){
    body{padding:32px 24px 60px;}
    h1{font-size:28px;}
    #log{height:300px;}
    .acts{grid-template-columns:repeat(4,1fr);}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>逃家游戏</h1>
      <div class="sub">撑到 18 岁，名下有套房，就能逃出去。</div>
    </div>
    <a class="dl" href="https://github.com/Sobsh562u/Escape-from-Home/releases/tag/v1.0" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 19h16"/></svg>
      下载
    </a>
  </header>

  <div class="tabs" role="group" aria-label="选择版本">
    <button class="tab" data-mode="orig" aria-pressed="true">原始版</button>
    <button class="tab" data-mode="revert" aria-pressed="false">反转版</button>
    <button class="tab" data-mode="hard" aria-pressed="false">困难版</button>
  </div>

  <section class="panel">
    <div class="stats">
      <div class="stat">血条<b id="hpNum">100</b></div>
      <div class="hpbar"><div class="hpfill" id="hpFill"></div></div>
      <div class="stat">第<b id="dayNum">0</b>天</div>
    </div>
    <div id="log" aria-live="polite"></div>

    <div class="acts">
      <button class="primary" id="btnExam">考试</button>
      <button id="btnRun">逃跑</button>
      <button id="btnCall">报警</button>
      <button id="btnAuthor">作者模式</button>
    </div>

    <div class="jumpbox" id="jumpBox">
      <input id="jumpInput" type="number" placeholder="跳到第几天（可负数）" inputmode="numeric">
      <button id="jumpGo">跳</button>
    </div>

    <p class="note" id="note">原始版：撑过 5 天即通关。考 0 分扣 40 血。</p>

    <div class="footbar">
      <button id="btnRestart">重新开始本局</button>
      <button id="btnExport">导出存档包</button>
      <button id="btnImport">导入存档</button>
      <input type="file" id="fileInput" accept=".zip,.json,.txt" hidden>
    </div>
    <p class="saveHint">本局进度会自动保存，关掉网页也还在。导出的是压缩包，里面记着你的天数、难度和经历。</p>
  </section>

  <footer>
    网页版由 <a href="https://github.com/Sobsh562u/Escape-from-Home" target="_blank" rel="noopener">Escape-from-Home</a> 提供 ·
    MIT License · Copyright (c) 2026 Sobsh562u<br>
    想玩可执行文件？点右上角「下载」跳到发行版页面。
  </footer>
</div>

<script src="https://fastly.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script>
(function () {
  "use strict";

  var MODES = {
    orig: {
      label: "原始版",
      hp: 100, max: 100, goal: 5,
      note: "原始版：撑过 5 天即通关。考 0 分扣 40 血，60 分以下扣 15 血，60 分以上加 10 血。逃跑会被抓回来打一顿，扣 20 血。",
      run: function (s) {
        return { hp: -20, keepDay: true, tone: "bad",
          text: "你想走出这个家门，刚把门拉开一条缝，妈妈一把把你拽回来，抄起拖鞋就打——扣 20 血，这一天没过成。" };
      },
      call: function () {
        return { end: true, lines: [
          "你拨通了 110……",
          "警察问清地址，几分钟后警车停在楼下。",
          "警察把你妈妈带走了。",
          "你名下有房，明天 18 岁生日——自由了。",
          "隐藏结局达成：正义报警。"
        ]};
      },
      exam: function (s, score) {
        if (score === 0) return { hp: -40, text: "妈妈：你怎么考了鸭蛋？", tone: "bad" };
        if (score < 60) return { hp: -15, text: "妈妈：你怎么又考砸了？", tone: "bad" };
        return { hp: 10, text: "妈妈：这次考得不错，奖励你。", tone: "good" };
      },
      win: "第 5 天结束，你还活着。明天就是你 18 岁生日，你掏出钥匙，打开那套写着你名字的房子。结局达成：逃出这个家。"
    },
    revert: {
      label: "反转版",
      hp: 100, max: 100, goal: 6570,
      note: "反转版：规则全反，考砸加血、考好扣血；要撑到 6570 天（18 岁）才高考，分数越高结局越惨。",
      run: function (s) {
        var d = s.day;
        if (d < 3650) return { text: "你太小了，妈妈根本追不上，你跑掉了。结局达成：小小年纪成功逃家。", end: true };
        if (d < 6570) return { text: "半大孩子，跑了又回来了。", hp: 0, end: false };
        return { text: "都 18 岁了才跑？妈妈就在门口等着，当场抓回。", end: true };
      },
      call: function () {
        return { end: true, lines: ["警察来了，把你抓走了。", "结局达成：报警反被抓。"] };
      },
      exam: function (s, score) {
        if (score < 60) return { hp: 60, text: "妈妈大喜：考砸了她反而放心，加了 60 血。", tone: "good" };
        return { hp: -60, text: "妈妈暴怒：考好了她怕你太优秀，扣了 60 血。", tone: "bad" };
      },
      gaokao: function (score) {
        if (score >= 700) return "妈妈：考这么高？肯定作弊！拿鸡毛掸子追着打。结局达成：考太高被当成作弊打死了。";
        if (score >= 400) return "考了 " + score + " 分，本科——但妈妈逼你复读，关在家里不许出门。结局达成：考上本科却失去自由。";
        if (score >= 200) return "考了 " + score + " 分，大专。妈妈懒得管你了，你搬出去住。结局达成：成绩一般反而自由了。";
        return "考了 " + score + " 分，妈妈气到晕倒，没人管你了。结局达成：考砸反而没人管，自由了。";
      },
      win: ""
    },
    hard: {
      label: "困难版",
      hp: 50, max: 50, goal: 10,
      note: "困难版：血条只有 50，要撑 10 天。考 0 分扣 25 血，跑也有代价，报警没人来救。",
      run: function (s) {
        if (Math.random() < 0.2) return { hp: -10, text: "天没黑你不敢跑，被妈妈抓个正着，扣 10 血。", tone: "bad" };
        return { hp: -5, text: "黑灯瞎火跑出门，又冷又饿，扣 5 血。", tone: "bad" };
      },
      call: function () {
        return { end: true, lines: ["你拨通 110，警察说：小孩子别乱打电话！", "结局达成：被当成恶作剧，没人来救你。"] };
      },
      exam: function (s, score) {
        if (score === 0) return { hp: -25, text: "妈妈：鸭蛋？！跪墙角！", tone: "bad" };
        if (score < 60) return { hp: -15, text: "妈妈：又不及格！", tone: "bad" };
        if (score < 90) return { hp: 5, text: "妈妈：还行，别骄傲。", tone: "good" };
        return { hp: 8, text: "妈妈：不错。", tone: "good" };
      },
      win: "你撑过了 10 天。18 岁生日，名下有房。结局达成：困难模式通关。"
    }
  };

  var state = null;
  var els = {
    log: document.getElementById("log"),
    hpNum: document.getElementById("hpNum"),
    dayNum: document.getElementById("dayNum"),
    hpFill: document.getElementById("hpFill"),
    note: document.getElementById("note"),
    jump: document.getElementById("jumpBox"),
    jumpInput: document.getElementById("jumpInput"),
    btnExam: document.getElementById("btnExam"),
    btnRun: document.getElementById("btnRun"),
    btnCall: document.getElementById("btnCall"),
    btnAuthor: document.getElementById("btnAuthor")
  };

  function rand(n) { return Math.floor(Math.random() * n); }

  function line(text, cls) {
    if (!state.log) state.log = [];
    state.log.push({ t: text, c: cls || "" });
    if (state.log.length > 200) state.log = state.log.slice(-200);
    renderLine(text, cls);
  }

  function renderLine(text, cls) {
    var p = document.createElement("p");
    if (cls) p.className = cls;
    p.textContent = text;
    els.log.appendChild(p);
    els.log.scrollTop = els.log.scrollHeight;
  }

  var SAVE_PREFIX = "escapeHome_save_v2_";

  function saveState() {
    if (!state) return;
    try {
      localStorage.setItem(SAVE_PREFIX + state.mode, JSON.stringify({
        hp: state.hp, day: state.day, over: state.over, log: state.log
      }));
    } catch (e) {}
  }

  function loadSave(mode) {
    try {
      var raw = localStorage.getItem(SAVE_PREFIX + mode);
      if (!raw) return null;
      var d = JSON.parse(raw);
      if (!d || typeof d.hp !== "number" || typeof d.day !== "number") return null;
      return d;
    } catch (e) { return null; }
  }

  function clearSave(mode) {
    try { localStorage.removeItem(SAVE_PREFIX + mode); } catch (e) {}
  }

  function updateStats() {
    els.hpNum.textContent = state.hp;
    els.dayNum.textContent = state.day;
    var pct = Math.max(0, Math.min(100, (state.hp / state.cfg.max) * 100));
    els.hpFill.style.width = pct + "%";
    els.hpFill.className = "hpfill" + (pct <= 30 ? " low" : "");
    saveState();
  }

  var EVENTS = [
    { hp: 5, text: "妈妈接了个电话，出门半小时。你趴在桌上，喘了口气。" },
    { hp: 5, text: "邻居阿姨敲门，塞给你一包饼干。你没敢说谢谢。" },
    { hp: -5, text: "妈妈翻你的书包，翻出一张皱巴巴的测验卷，又数落了你一顿。" },
    { hp: 0, text: "楼下有人放歌，你趴在窗台上听完了整首。这一刻没人管你。" },
    { hp: -8, text: "半夜停电，你摸黑找手电筒，膝盖磕在桌角上。" },
    { hp: 3, text: "你在作业本背面偷偷画了一扇门，画完心里松了一点。" },
    { hp: 0, text: "妈妈突然问你：你是不是想离开这个家？你没敢回答。" },
    { hp: 4, text: "雨下了一整天，妈妈没来查作业，你睡了个囫囵觉。" }
  ];

  function maybeEvent() {
    if (Math.random() > 0.45) return false;
    var ev = EVENTS[rand(EVENTS.length)];
    line(ev.text, ev.hp > 0 ? "good" : (ev.hp < 0 ? "bad" : "day"));
    if (ev.hp > 0) line("恢复 " + ev.hp + " 血。", "good");
    if (ev.hp < 0) line("扣 " + (-ev.hp) + " 血。", "bad");
    if (ev.hp) {
      if (applyHp(ev.hp)) return true;
    }
    return false;
  }

  function reset(mode, forceNew) {
    var cfg = MODES[mode];
    state = { mode: mode, cfg: cfg, hp: cfg.hp, day: 0, over: false, log: [] };
    els.log.innerHTML = "";
    els.jump.classList.remove("show");
    els.note.textContent = cfg.note;

    var saved = forceNew ? null : loadSave(mode);
    if (saved && !saved.over && saved.log && saved.log.length) {
      state.hp = saved.hp;
      state.day = saved.day;
      state.log = saved.log;
      state.log.forEach(function (it) { renderLine(it.t, it.c); });
      renderLine("（接着上一局继续 · 第 " + state.day + " 天 · 血条 " + state.hp + " / " + cfg.max + "）", "day");
      setButtons(false);
      updateStats();
      return;
    }
    if (saved && saved.over) clearSave(mode);

    line(cfg.note, "day");
    line("———— 第 0 天 ————", "day");
    setButtons(false);
    updateStats();
    saveState();
  }

  function setButtons(disabled) {
    [els.btnExam, els.btnRun, els.btnCall, els.btnAuthor].forEach(function (b) { b.disabled = disabled; });
  }

  function clamp() {
    if (state.hp > state.cfg.max) state.hp = state.cfg.max;
    if (state.hp < 0) state.hp = 0;
  }

  function gameOver(reason) {
    state.over = true;
    setButtons(true);
    if (reason) line(reason, "end");
    line("这局结束了。点「重新开始本局」再玩一次。", "day");
    saveState();
  }

  function applyHp(delta) {
    state.hp += delta;
    clamp();
    updateStats();
    if (state.hp <= 0) {
      gameOver("血条归零，你被打死了。GAME OVER。");
      return true;
    }
    return false;
  }

  function nextDay() {
    if (state.mode === "revert" && state.day >= 6570) {
      var gscore = rand(751);
      line("高考！你考了 " + gscore + " 分！", "day");
      gameOver(state.cfg.gaokao(gscore));
      return;
    }
    state.day += 1;
    updateStats();
    if (state.day >= state.cfg.goal && state.mode !== "revert") {
      gameOver(state.cfg.win);
      return;
    }
    line("———— 第 " + state.day + " 天 ————", "day");
  }

  function doExam() {
    if (state.over) return;
    var score = rand(101);
    line("你考了 " + score + " 分。", "day");
    var r = state.cfg.exam(state, score);
    if (r.hp !== 0) {
      if (r.hp < 0) line(r.text + " 扣 " + (-r.hp) + " 血。", "bad");
      else line(r.text + " 加 " + r.hp + " 血。", "good");
      if (applyHp(r.hp)) return;
    } else {
      line(r.text, r.tone);
    }
    line("血条 " + state.hp + " / " + state.cfg.max, "day");
    if (maybeEvent()) return;
    nextDay();
  }

  function doRun() {
    if (state.over) return;
    var r = state.cfg.run(state);
    if (r.lines) {
      r.lines.forEach(function (t) { line(t, "end"); });
      gameOver("游戏结束。");
      return;
    }
    line(r.text, r.tone || "bad");
    if (r.end) { gameOver("游戏结束。"); return; }
    if (r.hp) { if (applyHp(r.hp)) return; }
    if (r.hp && r.keepDay) return;
    if (maybeEvent()) return;
    nextDay();
  }

  function doCall() {
    if (state.over) return;
    var r = state.cfg.call(state);
    r.lines.forEach(function (t) { line(t, "day"); });
    gameOver("游戏结束。");
  }

  els.btnExam.addEventListener("click", doExam);
  els.btnRun.addEventListener("click", doRun);
  els.btnCall.addEventListener("click", doCall);
  document.getElementById("btnRestart").addEventListener("click", function () {
    clearSave(state.mode);
    reset(state.mode, true);
    line("———— 重新开始 ————", "day");
    saveState();
  });

  // ===== 存档包：导出 / 导入 =====
  function buildPack() {
    return {
      game: "逃家游戏 Escape from Home 网页版",
      packVersion: 2,
      mode: state.mode,
      modeLabel: state.cfg.label,
      day: state.day,
      hp: state.hp,
      max: state.cfg.max,
      savedAt: new Date().toLocaleString("zh-CN"),
      log: state.log
    };
  }

  function packToText(p) {
    var lines = [
      "逃家游戏 · 存档包",
      "导出时间：" + p.savedAt,
      "难度：" + p.modeLabel,
      "进度：第 " + p.day + " 天",
      "血条：" + p.hp + " / " + p.max,
      "",
      "—— 这段时间你经历过 ——"
    ];
    (p.log || []).forEach(function (it, i) {
      lines.push((i + 1) + ". " + it.t);
    });
    return lines.join("\n");
  }

  function downloadBlob(blob, filename) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(function () {
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }, 800);
  }

  document.getElementById("btnExport").addEventListener("click", function () {
    if (state.over) {
      line("这局已经结束了，重新开一局再导出吧。", "bad");
      return;
    }
    var pack = buildPack();
    var base = "逃家游戏存档-" + pack.modeLabel + "-第" + pack.day + "天";
    var pwd = window.prompt("给存档设个密码？（留空＝不加密，直接发给别人就能接着玩）", "");
    if (pwd === null) return;
    pwd = pwd.trim();

    var ready;
    if (pwd) {
      if (!window.crypto || !crypto.subtle) {
        line("这个页面不在安全环境（没 https），加密用不了，改导出成明文存档。", "bad");
        ready = Promise.resolve(JSON.stringify(pack, null, 2));
        pwd = "";
      } else {
        ready = encryptSave(pack, pwd);
      }
    } else {
      ready = Promise.resolve(JSON.stringify(pack, null, 2));
    }

    ready.then(function (json) {
      var note = packToText(pack) + (pwd ? "\n\n注意：这份存档带密码保护，导入时要输入导出时设的密码。" : "");
      if (window.JSZip) {
        var zip = new window.JSZip();
        zip.file("存档.json", json);
        zip.file("存档说明.txt", note);
        zip.generateAsync({ type: "blob" }).then(function (blob) {
          downloadBlob(blob, base + (pwd ? "-加密" : "") + ".zip");
          line("存档包已导出" + (pwd ? "（已加密，别人没密码打不开）" : "（未加密）"), "good");
        });
      } else {
        downloadBlob(new Blob([json], { type: "application/json" }), base + ".json");
        line("网络不通，已导出成 json 存档文件。", "day");
      }
    }).catch(function () {
      line("加密失败，换个密码再试。", "bad");
    });
  });

  // ===== 存档加密（可选密码，AES-GCM + PBKDF2）=====
  function b64(bytes) {
    var arr = new Uint8Array(bytes), s = "";
    for (var i = 0; i < arr.length; i++) s += String.fromCharCode(arr[i]);
    return btoa(s);
  }

  function unb64(str) {
    var s = atob(str), arr = new Uint8Array(s.length);
    for (var i = 0; i < s.length; i++) arr[i] = s.charCodeAt(i);
    return arr;
  }

  function deriveKey(pwd, salt) {
    var enc = new TextEncoder();
    return crypto.subtle.importKey("raw", enc.encode(pwd), "PBKDF2", false, ["deriveKey"]).then(function (mat) {
      return crypto.subtle.deriveKey(
        { name: "PBKDF2", salt: salt, iterations: 10000, hash: "SHA-256" },
        mat, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
    });
  }

  function encryptSave(pack, pwd) {
    var salt = crypto.getRandomValues(new Uint8Array(16));
    var iv = crypto.getRandomValues(new Uint8Array(12));
    return deriveKey(pwd, salt).then(function (key) {
      return crypto.subtle.encrypt({ name: "AES-GCM", iv: iv }, key, new TextEncoder().encode(JSON.stringify(pack)));
    }).then(function (buf) {
      return JSON.stringify({
        encrypted: true, algo: "AES-GCM / PBKDF2-SHA256",
        salt: b64(salt), iv: b64(iv), data: b64(buf)
      }, null, 2);
    });
  }

  function decryptSave(obj, pwd) {
    var salt = unb64(obj.salt), iv = unb64(obj.iv), data = unb64(obj.data);
    return deriveKey(pwd, salt).then(function (key) {
      return crypto.subtle.decrypt({ name: "AES-GCM", iv: iv }, key, data);
    }).then(function (buf) {
      return JSON.parse(new TextDecoder().decode(buf));
    });
  }

  function applyPack(pack) {
    if (!pack || !MODES[pack.mode]) return false;
    if (typeof pack.day !== "number" || typeof pack.hp !== "number") return false;
    var mode = pack.mode;
    state = { mode: mode, cfg: MODES[mode], hp: pack.hp, day: pack.day, over: false, log: [] };
    state.hp = Math.max(0, Math.min(state.cfg.max, state.hp));
    if (state.hp <= 0) state.hp = 1;
    els.log.innerHTML = "";
    els.jump.classList.remove("show");
    els.note.textContent = state.cfg.note;
    var logs = (pack.log || []).filter(function (it) { return it && it.t; });
    if (!logs.length) logs = [{ t: state.cfg.note, c: "day" }];
    state.log = logs.slice(-200);
    state.log.forEach(function (it) { renderLine(it.t, it.c); });
    renderLine("（已导入存档包 · " + state.cfg.label + " · 第 " + state.day + " 天 · 血条 " + state.hp + " / " + state.cfg.max + "）", "day");
    Array.prototype.forEach.call(document.querySelectorAll(".tab"), function (b) {
      b.setAttribute("aria-pressed", b.dataset.mode === mode ? "true" : "false");
    });
    setButtons(false);
    updateStats();
    saveState();
    return true;
  }

  var fileInput = document.getElementById("fileInput");

  document.getElementById("btnImport").addEventListener("click", function () {
    fileInput.click();
  });

  fileInput.addEventListener("change", function () {
    var file = fileInput.files && fileInput.files[0];
    if (!file) return;
    var reader = new FileReader();
    var isZip = /\.zip$/i.test(file.name);

    reader.onload = function () {
      var text = String(reader.result || "");
      if (!isZip) {
        tryLoading(text);
        return;
      }
      if (!window.JSZip) {
        line("网络不通，压缩包解不开。可以直接导入解压出来的存档.json。", "bad");
        return;
      }
      window.JSZip.loadAsync(file).then(function (zip) {
        var entry = null;
        zip.forEach(function (path, f) {
          if (!entry && /\.json$/i.test(path)) entry = f;
        });
        if (!entry) {
          line("这个压缩包里没有存档.json，不是存档包。", "bad");
          return;
        }
        entry.async("string").then(function (s) { tryLoading(s); });
      }).catch(function () {
        line("压缩包读取失败，可能损坏了。", "bad");
      });
    };

    function tryLoading(str) {
      var pack;
      try {
        pack = JSON.parse(str);
      } catch (e) {
        line("这不是有效的存档文件。", "bad");
        fileInput.value = "";
        return;
      }
      if (pack && pack.encrypted) {
        if (!window.crypto || !crypto.subtle) {
          line("这个页面不在安全环境（没 https），解不开加密存档。", "bad");
          fileInput.value = "";
          return;
        }
        var pwd = window.prompt("这份存档带密码，请输入导出时设的密码：", "");
        if (pwd === null) {
          line("取消了导入。", "day");
          fileInput.value = "";
          return;
        }
        decryptSave(pack, pwd.trim()).then(function (real) {
          if (applyPack(real)) {
            line("密码正确，存档导入成功，接着玩吧。", "good");
          } else {
            line("存档内容不对（缺难度或天数），导入失败。", "bad");
          }
          fileInput.value = "";
        }).catch(function () {
          line("密码不对，或者这份存档被改坏了。", "bad");
          fileInput.value = "";
        });
        return;
      }
      if (applyPack(pack)) {
        line("存档导入成功，接着玩吧。", "good");
      } else {
        line("存档内容不对（缺难度或天数），导入失败。", "bad");
      }
      fileInput.value = "";
    }

    reader.readAsText(file);
  });
  els.btnAuthor.addEventListener("click", function () {
    if (state.over) return;
    els.jump.classList.toggle("show");
    if (els.jump.classList.contains("show")) els.jumpInput.focus();
  });
  document.getElementById("jumpGo").addEventListener("click", function () {
    var v = parseInt(els.jumpInput.value, 10);
    if (isNaN(v)) { line("请输入一个数字。", "bad"); return; }
    if (state.mode === "revert" || state.mode === "hard") {
      state.day = v;
      els.jump.classList.remove("show");
      els.jumpInput.value = "";
      updateStats();
      if (state.day >= state.cfg.goal && state.mode === "hard") {
        gameOver(state.cfg.win);
        return;
      }
      if (state.day < 0) {
        line("你跳到了第 " + v + " 天，也就是还没出生的年代。妈妈都还没出生，谁在逼你考试？", "day");
        gameOver("结局达成：祖父悖论。");
        return;
      }
      line("———— 第 " + state.day + " 天 ————", "day");
    } else {
      state.day = v;
      els.jump.classList.remove("show");
      els.jumpInput.value = "";
      updateStats();
      if (v < 0) {
        line("你跳到了第 " + v + " 天……", "day");
        gameOver(v <= -100 ? "穿越到妈妈还没出生的年代。结局达成：祖父悖论。" : "你还是个受精卵。结局达成：受精卵体外死亡。");
        return;
      }
      line("———— 第 " + state.day + " 天 ————", "day");
    }
  });

  Array.prototype.forEach.call(document.querySelectorAll(".tab"), function (btn) {
    btn.addEventListener("click", function () {
      Array.prototype.forEach.call(document.querySelectorAll(".tab"), function (b) {
        b.setAttribute("aria-pressed", b === btn ? "true" : "false");
      });
      reset(btn.dataset.mode);
    });
  });

  reset("orig");
})();
</script>
