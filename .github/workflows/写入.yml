name: 写入文件

on:
  workflow_dispatch:
    inputs:
      path:
        description: 要写入的文件路径
        required: true
        type: string
      content:
        description: 文件内容（用 \n 表示换行）
        required: true
        type: string
      message:
        description: 提交说明
        required: false
        default: 自动化写入
        type: string

permissions:
  contents: write

jobs:
  write:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 写入并提交
        env:
          CONTENT: ${{ inputs.content }}
          TARGET: ${{ inputs.path }}
          MESSAGE: ${{ inputs.message }}
        run: |
          set -e
          mkdir -p "$(dirname "$TARGET")"
          printf '%b' "$CONTENT" > "$TARGET"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$TARGET"
          git commit -m "$MESSAGE" || echo "没有变化，跳过提交"
          git push
