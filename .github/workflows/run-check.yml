name: 跑路版检查

on:
  push:
    branches: [main, test]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-mode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 编译 C 版
        run: |
          gcc -Wall -Wextra -Werror -O2 逃家游戏_C版.c -o /tmp/game
          echo "编译通过"

      - name: 跑路版能攒钱、能出门、能过站
        run: |
          printf '12345678\n60\n跑\n等\n等\n等\n' | /tmp/game -m run > /tmp/out.txt
          cat /tmp/out.txt
          grep -q '幼儿园站' /tmp/out.txt
          grep -q '学校站' /tmp/out.txt
          grep -q '大学站' /tmp/out.txt
          echo "三站流程正常"

      - name: 跑路版存档带 money / stage
        run: |
          mkdir -p /tmp/s && cd /tmp/s
          printf '12345678\n60\n导出\n\n\n' | /tmp/game -m run >/dev/null
          python3 -c "
          import glob, json
          files = glob.glob('/tmp/s/*.json')
          assert files, '没有导出存档'
          d = json.load(open(files[0], encoding='utf-8'))
          assert d['mode'] == 'run', d['mode']
          assert d['packVersion'] == 2
          assert isinstance(d.get('money'), int), d.get('money')
          assert isinstance(d.get('stage'), int), d.get('stage')
          print('跑路版存档合法:', d['money'], d['stage'])
          "

      - name: Python 跑路版语法与实跑
        run: |
          python3 -m py_compile 逃家游戏_跑路版.py
          printf '12345678\n60\n跑\n等\n等\n等\n' | python3 逃家游戏_跑路版.py | grep -q '终点站' && echo "Python 跑路版通关"

      - name: 终点站要自己下车
        run: |
          printf '12345678\n100\n跑\n等\n等\n等\n走了\n' | /tmp/game -m run > /tmp/a.txt
          grep -q '结局达成：终点站' /tmp/a.txt && echo "走了 → 终点站"
          printf '12345678\n100\n跑\n等\n等\n等\n坐\n' | /tmp/game -m run > /tmp/b.txt
          grep -q '结局达成：坐过站' /tmp/b.txt && echo "坐 → 坐过站"

      - name: 网页版含跑路版入口
        run: |
          grep -q 'data-mode="run"' index.html && echo "网页版有跑路版标签"
          grep -q 'run_win' index.html && echo "网页版有终点站结局"
          grep -q 'run_rich' index.html && echo "网页版有攒够了也不走结局"
